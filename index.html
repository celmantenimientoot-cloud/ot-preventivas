<style>

html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--card)}
.bar{background:var(--pri);color:var(--pri-ink);padding:12px 16px;display:flex;align-items:center;gap:10px}

.bar button{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;padding:6px 12px;min-height:40px}

.card .t{font-weight:700}.piso{font-size:20px;font-weight:800;color:var(--pri)}.card .m{font-size:13.5px;color:var(--muted)}
.prog{height:9px;background:#e3e9e6;border-radius:5px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri)}
.big{display:block;width:100%;background:var(--pri);color:#fff;border:0;border-radius:12px;padding:15px;font-size:18px;font-weight:700;min-height:56px;cursor:pointer}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{flex:1;min-height:44px;border:0;background:#fff}.seg button[aria-pressed=true]{background:var(--pri);color:#fff;font-weight:600}

button.card{font:inherit;color:inherit}

.h-sug{display:flex;flex-direction:column;gap:4px} .h-sug:empty{display:none} .h-sug button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;min-height:44px}
.h-sug button small{display:block;color:var(--muted);font-size:12px} .h-ev{padding:10px 12px} .h-cab{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.h-lb{font-size:11px;color:var(--muted);margin-top:7px;text-transform:uppercase;letter-spacing:.3px} .h-quien{margin-top:8px}

.den-eq{font-size:16px;font-weight:700;margin-bottom:2px}

.it2{padding:9px 0;border-bottom:1px solid #eef2f0;font-size:15.5px}.it2 .fila{display:flex;justify-content:space-between;align-items:center;gap:10px}
.it2 textarea{width:100%;border:1px solid #b4c2bd;border-radius:9px;padding:8px;margin-top:6px;font-size:16px}
.plano-w{overflow:auto;border:1px solid #b4c2bd;border-radius:9px;max-height:68vh;margin-top:6px;background:#fff;-webkit-overflow-scrolling:touch}
.plano{position:relative}.plano img{width:100%;display:block;user-select:none;-webkit-user-select:none}
.plano .pt{position:absolute;transform:translate(-50%,-50%);min-width:30px;height:30px;border-radius:15px;border:2px solid #c0392b;background:rgba(255,255,255,.88);font:700 11px system-ui,sans-serif;padding:0 3px;color:#c0392b;line-height:26px}
.plano .pt.ok{background:#15803d;border-color:#15803d;color:#fff;font-size:15px}.plano .pt.mal{background:#c0392b;color:#fff;font-size:14px}
.carpeta{text-align:left;width:100%;cursor:pointer;padding:16px}.carpeta .t{font-size:22px}.carpeta .ico{font-size:26px}.carpeta .m{font-size:15px;margin-top:4px}
.sv-fil{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.sv-fil label{display:flex;flex-direction:column;font-size:12px;font-weight:700;color:var(--muted);gap:3px}
.sv-fil select,.sv-fil input{min-height:40px;border:1px solid var(--line);border-radius:8px;padding:0 8px;font:15px system-ui,sans-serif;background:#fff}.sv-fil .ancho{grid-column:1/-1}
.sv-det{padding:8px 12px 12px;margin:0 0 6px;background:#f6f9f8;border-radius:0 0 10px 10px;border-bottom:1px solid #eef2f0;font-size:14px}
.sv-p{padding:3px 0}.sv-p.si{color:var(--ok)}.sv-p.no{color:var(--bad-ink);font-weight:700}
main{max-width:900px;margin-left:auto;margin-right:auto} /* en la PC no se estira de punta a punta */
.sup-b{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eef2f0;font-size:15px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.plano .pt,.pt-pop button,.pf-barra button{touch-action:manipulation} /* sin el zoom del doble toque: el plano no se corre solo */
.plano-w{overscroll-behavior:contain;touch-action:pan-x pan-y}
/* Plano a pantalla completa, con una barrita flotante (alejar, acercar, salir) */
.pf-barra{display:none}
body.plano-full{overflow:hidden}
.plano-w.full{position:fixed;inset:0;z-index:40;max-height:none;border-radius:0;border:0;margin:0}
body.plano-full .pf-barra{display:flex;position:fixed;top:8px;right:8px;z-index:45;gap:6px;align-items:center;background:rgba(255,255,255,.95);border:1px solid #b4c2bd;border-radius:10px;padding:4px 6px;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:12px;max-width:calc(100vw - 16px)}
.pf-barra button{min-width:40px;height:36px;border-radius:8px;border:1px solid #b4c2bd;background:#fff;font:700 18px system-ui,sans-serif}
.pf-barra button.sal{font-size:14px;padding:0 10px;background:var(--pri);color:#fff;border-color:var(--pri)}
.pf-barra span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Celular horizontal: el menú de opciones va de costado (no tapa el plano) y la barra de arriba no queda fija */
@media (orientation: landscape) and (max-height: 520px){
  .pt-pop{left:auto !important;top:0;bottom:0;width:min(42vw,280px);border-top:0;border-left:2px solid var(--pri);overflow:auto;padding:8px !important}
  .pt-pop .ops{grid-template-columns:1fr !important;gap:5px !important}
  .pt-pop .ops button{min-height:34px !important;font-size:13px !important}
  .bar,.net{position:static !important}
  .plano-w{max-height:calc(100vh - 16px)}
}
.pt-pop{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:2px solid var(--pri);padding:12px;box-shadow:0 -8px 24px rgba(0,0,0,.2)}
.pt-pop .ops{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.pt-pop .ops button{min-height:50px;border-radius:9px;border:1px solid #b4c2bd;background:#fff;font-weight:700;font-size:15px;text-align:left;padding:0 12px}
.med{display:flex;gap:6px;margin-top:6px}.med label{flex:1;display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.med input{border:1px solid #b4c2bd;border-radius:9px;padding:8px;min-height:44px;font-size:16px;width:100%}
.sn button:disabled{opacity:.6}
main>*{flex:none}
:focus-visible{outline:3px solid #e2bf00;outline-offset:2px}
</style>

<div class="app" id="app"><main><p class="o">Cargando…</p></main></div>
<script>
'use strict';
(() => { // todo adentro: en el simulador comparte la página con el servidor simulado
/* =====================================================================
   App de OT preventivas · funciona sin internet
   - Habla con el mini ERP (Apps Script, archivo AppPrev.gs) por la dirección /exec.
   - Guarda todo en la tablet (IndexedDB) y lo manda cuando hay señal.
   - El QR de cada equipo es su POSICIÓN. El de la tarjeta del bombero es "BOMB|id|clave".
   ===================================================================== */
// Dirección /exec del proyecto "API app preventivos" (NO la del mini ERP: esa pide cuenta de Google). Se completa al publicarlo.
const SERVIDOR = 'https://script.google.com/macros/s/AKfycbzOiXPcVwqBXRH0CSJH7ikE489uxdT1rbTJg7Gs9spmGIXSq891K76aFthpctjoFge0Ew/exec';
const MIN_INACTIVO = 30;           // la sesión del bombero se cierra sola (tablet compartida)
const MIN_INACTIVO_TEC = 240;      // en el celular propio del técnico, más tiempo
const LOTE = 5;                    // registros por envío (las fotos pesan)

/* ---------- guardado en la tablet ---------- */
const DB = (() => {
  let db;
  const abrir = () => db ? Promise.resolve(db) : new Promise((ok, mal) => {
    const r = indexedDB.open('ot-preventivas', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('cola', { keyPath: 'uid' }); };
    r.onsuccess = () => { db = r.result; ok(db); }; r.onerror = () => mal(r.error);
  });
  const tx = (st, modo, f) => abrir().then(d => new Promise((ok, mal) => { const t = d.transaction(st, modo), s = t.objectStore(st), r = f(s); t.oncomplete = () => ok(r && r.result); t.onerror = () => mal(t.error); }));
  return { get: k => tx('kv', 'readonly', s => s.get(k)), set: (k, v) => tx('kv', 'readwrite', s => s.put(v, k)), del: k => tx('kv', 'readwrite', s => s.delete(k)),
    cola: () => tx('cola', 'readonly', s => s.getAll()), encolar: r => tx('cola', 'readwrite', s => s.put(r)), quitar: uid => tx('cola', 'readwrite', s => s.delete(uid)) };
})();

/* ---------- estado ---------- */
const E = { pantalla: 'cargando', tablet: null, cat: null, sesion: null, cola: [], online: navigator.onLine, enviando: false, msg: '', tipo: 'EXT', q: '', pin: '', bomberoPin: '', control: null, ultimoUso: Date.now(), usarTarjeta: false, ot: null, borr: {} };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hoyIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const ahoraIso = () => { const d = new Date(); return hoyIso() + 'T' + [d.getHours(), d.getMinutes(), d.getSeconds()].map(x => String(x).padStart(2, '0')).join(':'); };
const fmtD = s => s ? s.slice(0, 10).split('-').reverse().join('/') : '–';
// Período de la recorrida: quincena, o el mes para los nichos interiores (HIN, una vez por mes con Extinred). Igual que el servidor.
const MENSUAL = { HIN: true };
const esNicho = e => e && (e.tipo === 'HID' || e.tipo === 'HIN');
const quincena = (iso, tipo) => iso.slice(0, 7) + '-' + (MENSUAL[tipo] ? 'M' : Number(iso.slice(8, 10)) <= 15 ? 1 : 2);
const ronda = (tipo, ed, iso) => 'PV-' + tipo + '-' + ed + '-' + quincena(iso, tipo);
// Recorridas en secuencia (hidrantes → extintores → …): una abierta por edificio; los nichos interiores los habilita mantenimiento
const rondaInfo = tipo => (E.cat && E.cat.rondas) ? (E.cat.rondas[tipo] || { id: '', estado: 'sin habilitar' }) : { id: ronda(tipo, E.tablet.ed, hoyIso()), estado: 'abierta' };
const rondaId = tipo => rondaInfo(tipo).id;
const rondaAbierta = tipo => rondaInfo(tipo).estado === 'abierta';
const diasAbierta = tipo => { const i = rondaInfo(tipo).inicio; return i ? Math.max(0, -diasHasta(String(i).slice(0, 10))) : null; };
const rondaBloqueoTxt = tipo => { const r = rondaInfo(tipo), n = E.cat.tipos || {};
  return r.estado === 'bloqueada' ? 'Se habilita cuando terminen ' + (n[r.espera] || 'la otra recorrida').toLowerCase() + '.' : 'Todavía no está habilitada: la habilita mantenimiento cuando el proveedor da la fecha.'; };
const MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const nombreQ = (iso, tipo) => (MENSUAL[tipo] ? 'mes de' : (Number(iso.slice(8, 10)) <= 15 ? '1ª' : '2ª') + ' quincena') + ' ' + MESES[Number(iso.slice(5, 7)) - 1];
const diasHasta = iso => iso ? Math.round((new Date(iso + 'T00:00:00') - new Date(hoyIso() + 'T00:00:00')) / 86400000) : null;
async function sha256(t){ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); }
function toast(t){ let el = document.querySelector('.toast'); if (!el){ el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = t; clearTimeout(toast.t); toast.t = setTimeout(() => el.remove(), 3000); }

/* ---------- servidor ---------- */
async function enviar(cuerpo){
  if (window.SIM_DOPOST) return window.SIM_DOPOST(cuerpo); // simulador de pruebas
  if (!/^https:\/\/script\.google\.com\//.test(SERVIDOR)) throw new Error('Falta configurar la dirección del servidor en la app.');
  const r = await fetch(SERVIDOR, { method: 'POST', body: JSON.stringify(cuerpo) }); // texto plano: sin consulta previa (CORS)
  if (!r.ok) throw new Error('El servidor respondió ' + r.status);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
const conClave = c => Object.assign({ tablet: E.tablet.id, clave: E.tablet.clave }, c);
async function guardarCatalogo(j){
  E.cat = { ahora: j.ahora, equipos: j.equipos, rutinas: j.rutinas, tipos: j.tipos, motivos: j.motivos || {}, hechos: j.hechos || {}, por: j.por || {}, abiertas: j.abiertas || {}, rondas: j.rondas || null, bomberos: j.bomberos, bajado: ahoraIso(),
    modo: j.modo || '', termo: j.termo || null, deposito: j.deposito || '' };
  (E.cola || []).forEach(r => depLocal(r)); // lo del depósito que todavía no se envió
  (E.cola || []).filter(r => r.manga).forEach(r => { const eq = (E.cat.equipos || []).find(e => esNicho(e) && e.pos === r.pos); if (eq) mangaLocal(eq, r.manga, r.ts); });
  await DB.set('catalogo', E.cat);
  // Si al bombero lo dieron de baja, se le cierra la sesión (lo que ya guardó se envía igual)
  if (E.sesion && !E.cat.bomberos.some(b => b.id === E.sesion.id)){ salir(); toast('Tu usuario fue dado de baja: avisá al supervisor'); }
}
function sinAcceso(e){
  if (!/TABLET_SIN_ACCESO/.test(e.message)) return false;
  E.tablet = null; DB.del('tablet'); E.sesion = null; E.pantalla = 'vincular';
  E.msg = esTec() ? 'Este celular quedó desvinculado. Volvé a vincularlo con tu tarjeta o tu PIN. Lo que no se envió sigue guardado.'
    : 'Esta tablet quedó desvinculada. Pedile un código nuevo al supervisor. Lo que no se envió sigue guardado.';
  return true;
}
async function bajar(){
  if (!E.tablet || !navigator.onLine) return;
  try { await guardarCatalogo(await enviar(conClave({ op: 'bajar' }))); E.errBajar = ''; }
  catch(e){ if (sinAcceso(e)) dibujar(); else E.errBajar = e.message || String(e); }
}
async function sincronizar(manual){
  if (E.enviando || !E.tablet) return;
  E.cola = await DB.cola();
  if (!navigator.onLine){ if (manual) toast('Sin señal: se envía solo cuando vuelva'); return; }
  E.enviando = true; dibujar();
  try {
    while (E.cola.length){
      const lote = E.cola.slice(0, LOTE);
      const j = await enviar(conClave({ op: 'subir', registros: lote }));
      for (const uid of j.recibidos || []) await DB.quitar(uid);
      await guardarCatalogo(j);
      E.cola = await DB.cola();
      if (!(j.recibidos || []).length) break;
    }
    if (!E.cola.length) await bajar();

// Una sola cámara a la vez: cada arranque tiene su número (gen). Si la pantalla se redibuja mientras la cámara
// todavía está abriendo, el arranque viejo se cancela y cierra su cámara (antes quedaba una "suelta" que seguía
// leyendo el QR y vibrando, y competía con la nueva: a veces no leía hasta actualizar la pantalla).
const CAM = { stream: null, timer: null, gen: 0, abriendo: false };
function pararCamara(){
  CAM.gen++; CAM.abriendo = false;

}

function cargarJsQR(){
  if (window.jsQR) return Promise.resolve();
  return _jsqr || (_jsqr = new Promise((ok, mal) => { const sc = document.createElement('script'); sc.src = 'jsQR.js'; sc.onload = ok; sc.onerror = () => { _jsqr = null; mal(new Error('no se pudo cargar el lector de QR')); }; document.head.appendChild(sc); }));

async function iniciarCamara(alLeer){
  pararCamara();

  let stream = null;

    let det = null;
    if ('BarcodeDetector' in window) det = new BarcodeDetector({ formats: ['qr_code'] });
    else {

      det = { detect: async el => { const w = el.videoWidth, h = el.videoHeight; if (!w || !h) return [];
        const k = Math.min(1, 800 / Math.max(w, h)); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
        g.drawImage(el, 0, 0, cv.width, cv.height); const im = g.getImageData(0, 0, cv.width, cv.height);

    stream = await navigator.mediaDevices.getUserMedia({ audio: false,

    if (gen !== CAM.gen){ stream.getTracks().forEach(t => t.stop()); return; } // mientras abría, la pantalla cambió
    CAM.stream = stream; CAM.abriendo = false;
    const vid = () => document.getElementById('video'); // la pantalla se redibuja: siempre el video que está a la vista

      if (gen !== CAM.gen){ clearInterval(CAM.timer); return; }

      if (ocupado || !el || el.readyState < 2) return;
      if (el.srcObject !== stream){ el.srcObject = stream; el.play().catch(() => {}); return; }

}

/* ---------- depósito de reserva de extintores (CEL: posiciones M4SSD) ----------
   Se controlan como cualquier extintor. Al reemplazar un extintor de un piso se elige el del depósito: pasa con sus
   datos al piso y el RETIRADO se guarda en esa posición del depósito, A RECARGAR, hasta que vuelve de DENAPOLI. */
const DATOS_EXT = ['ident', 'clase', 'peso', 'vtoExt', 'vtoCarga', 'vtoPH'];
const esDep = e => !!(e && e.tipo === 'EXT' && E.cat && E.cat.deposito && new RegExp(E.cat.deposito, 'i').test(e.pos));
const depVacia = e => esDep(e) && e.estadoPos === 'vacia';
const depRecargar = e => esDep(e) && e.estadoPos === 'recargar';
const depFuera = e => depVacia(e) || depRecargar(e); // no se controlan ni se usan para reponer
const depT_ = () => equiposDe('EXT').some(esDep);
const vencidoExt = e => ['vtoCarga', 'vtoPH', 'vtoExt'].some(k => diasHasta(e[k]) != null && diasHasta(e[k]) < 0);
const depDisponibles = (menos) => equiposDe('EXT').filter(e => esDep(e) && !depFuera(e) && e.ident && e.pos !== menos);
function depLocal(r){
  const eqs = (E.cat && E.cat.equipos) || [], fecha = fmtD(String(r.ts || ahoraIso()).slice(0, 10));
  if (r.deposito){ const eq = eqs.find(e => e.tipo === 'EXT' && e.pos === r.pos); if (eq){ DATOS_EXT.forEach(k => { eq[k] = String(r.deposito[k] || '').trim(); }); eq.estadoPos = ''; eq.nota = 'Cargado el ' + fecha; } }
  if (r.cambio && r.cambio.reemplazo && r.tipo === 'EXT'){
    // El que se colocó sale del depósito (si se eligió de la lista); el retirado se guarda ahí (o en la primera vacía), A RECARGAR
    const eq = eqs.find(e => e.tipo === 'EXT' && e.pos === r.pos), ret = r.cambio.retirado || {};
    let dep = r.cambio.desde ? eqs.find(e => e.tipo === 'EXT' && e.pos === r.cambio.desde) : null;
    if (dep && (depFuera(dep) || dep.ident !== r.cambio.ident)) dep = null;
    if (eq && dep) DATOS_EXT.forEach(k => { eq[k] = dep[k]; });
    const slot = esDep(eq) ? null : dep || eqs.filter(depVacia).sort((a, b) => a.pos.localeCompare(b.pos, 'es', { numeric: true }))[0];
    if (slot){ DATOS_EXT.forEach(k => { slot[k] = ret[k] || ''; }); slot.estadoPos = 'recargar'; slot.nota = (r.cambio.motivo || 'Retirado') + ' · salió de ' + r.pos + ' el ' + fecha; }
    else if (dep){ DATOS_EXT.forEach(k => { dep[k] = ''; }); dep.estadoPos = 'vacia'; dep.nota = 'Se usó en ' + r.pos + ' el ' + fecha; }
  }
  if (r.vacio){ const eq = eqs.find(e => e.tipo === r.tipo && e.pos === r.pos); if (esDep(eq) && !depFuera(eq)){ DATOS_EXT.forEach(k => { eq[k] = ''; }); eq.estadoPos = 'vacia'; eq.nota = 'Vacía en la recorrida del ' + fecha; } }
}
async function guardarDeposito(){
  const c = E.control, d = c.deposito;
  if (!String(d.ident || '').trim()){ E.msg = 'Escribí el ID del extintor.'; dibujar(); return; }
  if (!d.vtoCarga){ E.msg = 'Completá el vencimiento de la carga.'; dibujar(); return; }
  const r = { uid: E.tablet.id + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7), ts: ahoraIso(), tipo: 'EXT', pos: c.eq.pos,
    bombero: E.sesion.id, resp: {}, deposito: Object.fromEntries(DATOS_EXT.map(k => [k, String(d[k] || '').trim()])) };
  await DB.encolar(r);
  depLocal(r); await DB.set('catalogo', E.cat);
  E.cola = await DB.cola();
  toast('Listo: ' + c.eq.pos + ' tiene el extintor ' + r.deposito.ident);
  E.control = null; E.pantalla = 'escanear'; E.msg = '';
  dibujar(); sincronizar();
}

/* ---------- control de un equipo ---------- */
function abrirControl(pos, tipo){
  const eq = (E.cat.equipos || []).find(e => e.pos.toUpperCase() === pos.toUpperCase() && (!tipo || e.tipo === tipo))
    || (E.cat.equipos || []).find(e => e.ident && e.ident === pos); // por si escanean una etiqueta vieja con el ID
  if (!eq){ E.msg = 'No encontré el equipo "' + pos + '". Probá con "Buscar sin QR".'; E.pantalla = 'inicio'; dibujar(); return; }
  // Recorrida en espera: igual se puede abrir el equipo para reemplazarlo (vencido, despresurizado…) o cambiar la manga;
  // ese control no cuenta para ninguna recorrida
  E.control = { eq, resp: {}, obs: '', foto: '', cambio: null, editar: false, reemplazo: false, fuera: !rondaAbierta(eq.tipo) };
  E.pantalla = 'control'; E.msg = ''; dibujar();

// Los puntos del control: los del tipo, o uno solo (equipo con control simple, ej. el nicho de la vereda municipal)
const rutDe = e => e && e.control === 'simple' ? [['GEN', 'Estado general']] : E.cat.rutinas[e.tipo];
async function guardarControl(){
  const c = E.control, rut = rutDe(c.eq);
  const hayNo = !c.vacio && rut.some(([k]) => c.resp[k] === 'NO');
  if (!c.vacio){
    const faltan = rut.filter(([k]) => !c.resp[k]);
    if (faltan.length){ E.msg = 'Falta responder: ' + faltan.map(x => x[1]).join(', ') + '.'; dibujar(); return; }
    if (c.cambio && c.reemplazo && !c.cambio.motivo){ E.msg = 'Elegí el motivo del reemplazo.'; dibujar(); return; }
    if (c.cambio && c.reemplazo && !String(c.cambio.ident || '').trim()){ E.msg = 'Completá el ID nuevo o cancelá el cambio.'; dibujar(); return; }
  }
  if (c.cambio && c.reemplazo) c.cambio.retirado = Object.fromEntries(DATOS_EXT.map(k => [k, c.eq[k] || '']));
  const r = { uid: E.tablet.id + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7), ts: ahoraIso(), tipo: c.eq.tipo, pos: c.eq.pos,
    bombero: E.sesion.id, resp: c.vacio ? {} : c.resp, obs: c.obs.trim(), foto: c.foto, cambio: c.vacio ? null : c.cambio || null, vacio: !!c.vacio, fuera: !!c.fuera };
  await DB.encolar(r);
  // El cambio de equipo se ve enseguida en la tablet, aunque no haya señal
  if (r.cambio){ depLocal(r); Object.assign(c.eq, Object.fromEntries(Object.entries(r.cambio).filter(([k, v]) => k !== 'reemplazo' && k !== 'motivo' && k !== 'desde' && k !== 'retirado' && v))); }
  if (r.vacio) depLocal(r);
  if (r.cambio || r.vacio) await DB.set('catalogo', E.cat);
  E.cola = await DB.cola();
  toast(c.vacio ? 'Guardado · se avisa al supervisor' : r.cambio && c.reemplazo ? 'Reemplazo guardado · queda una línea para el supervisor' : hayNo ? 'Guardado · se propone correctivo al supervisor' : 'Guardado');
  E.control = null; E.pantalla = 'escanear'; E.msg = '';
  dibujar(); sincronizar();
}

   Cuando vuelve, la manga trae un código nuevo y su vencimiento (mes y año: vale hasta el último día del mes). */
const esSust = e => esNicho(e) && e.manga === 'sustituta';
function mangaLocal(eq, m, ts){

  else if (m.accion === 'vuelve'){

function fotoElegida(input){
  const f = input.files && input.files[0]; if (!f) return;
  const img = new Image(), url = URL.createObjectURL(f);
  img.onload = () => {
    const m = 1024, k = Math.min(1, m / Math.max(img.width, img.height)), cv = document.createElement('canvas');
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    E.control.foto = cv.toDataURL('image/jpeg', 0.7); URL.revokeObjectURL(url); dibujar();
  };
  img.src = url;
}

const CAMPOS_PLANO = {

// Para el PDF: el plano con las marcas, armado en el celular (también sin señal)
async function planoMarcado(it, v){
  const img = await new Promise((ok, mal) => { const im = new Image(); im.onload = () => ok(im); im.onerror = mal; im.src = it.plano.img; });
  const W = Math.min(2400, img.naturalWidth), z = W / it.plano.w, cv = document.createElement('canvas');

  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = 'bold 20px sans-serif';
  it.plano.pts.forEach((q, i) => { const m = (v.pts || {})[i]; if (!m) return;
    g.beginPath(); g.arc(q[1] * z, q[2] * z, 17, 0, 2 * Math.PI); g.fillStyle = m === 'ok' ? '#15803d' : '#c0392b'; g.fill();
    g.fillStyle = '#fff'; g.fillText(m === 'ok' ? '✓' : m === 'sf' ? 'X' : m, q[1] * z, q[2] * z + 1); });
  // Cuadro del plano: FECHA y TÉCNICO se completan solos (el registro se sube a SharePoint y tiene que tenerlos)
  const cp = CAMPOS_PLANO[it.plano.img];
  if (cp){
    const d = new Date(), fecha = String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
    g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillStyle = '#0b3d91'; g.font = 'bold ' + Math.round(34 * z) + 'px sans-serif';

  if (a === 'h-reintentar'){ hCargarCat(); return; }
  if (a === 'h-per'){ HB.f.per = t.dataset.k; if (t.dataset.k === 'f' && !HB.f.desde){ HB.f.desde = hoyIso().slice(0, 4) + '-01-01'; HB.f.hasta = hoyIso(); } HB.err = ''; dibujar(); return; }
  if (a === 'h-vista'){ HB.vista = t.dataset.k; dibujar(); return; }
  if (a === 'h-buscar'){ hBuscar(); return; }
  if (a === 'h-sug'){ HB.f.q = t.dataset.v; const i = document.getElementById('h-q'); if (i) i.value = t.dataset.v; document.getElementById('h-sug').innerHTML = ''; hBuscar(); return; }
  if (a === 'hq-salir'){ E.qr = null; HQ.datos = null; E.pantalla = 'inicio'; dibujar(); return; }
  if (a === 'hq-reintentar'){ cargarHistorial(); return; }
  if (a === 'sin-acceso'){ sinAccesoEquipo(); return; }
  if (a === 'tecla'){ if (esTec() && E.cat.bomberos[0]) E.bomberoPin = E.cat.bomberos[0].id; if (E.pin.length < 4) E.pin += t.dataset.n; E.msg = ''; dibujar(); if (E.pin.length === 4) entrarConPin(); return; }
  if (a === 'borrar'){ E.pin = E.pin.slice(0, -1); dibujar(); return; }
  if (a === 'pin-volver'){ E.bomberoPin = ''; E.pin = ''; E.msg = ''; dibujar(); return; }
  if (a === 'sync'){ sincronizar(true); return; }
  if (a === 'actualizar'){ t.disabled = true; toast('Actualizando la lista…'); await actualizarSola(); dibujar(); toast(E.errBajar ? 'No se pudo actualizar' : 'Lista actualizada'); return; }
  if (a === 'salir'){ salir(); return; }
  if (a === 'inicio'){ E.pantalla = 'inicio'; E.ot = null; E.msg = ''; dibujar(); return; }
  if (a === 'escanear'){ E.pantalla = 'escanear'; E.msg = ''; dibujar(); return; }
  if (a === 'buscar'){ E.pantalla = 'buscar'; E.soloSust = false; E.msg = ''; dibujar(); return; }
  if (esEncargado() && ['escanear', 'buscar', 'elegir', 'ver-sust'].includes(a)) return; // solo consulta
  if (a === 'sup-tipo'){ E.supTipo = t.dataset.t; dibujar(); return; }
  if (a === 'entregar'){ E.entTipo = t.dataset.t; E.entMotivo = ''; E.msg = ''; E.pantalla = 'entregar'; dibujar(); window.scrollTo(0, 0); return; }
  if (a === 'entregar-ok'){ entregarRonda(); return; }
  if (a === 'sv-recargar'){ if (E.sv) E.sv.local = false; cargarSuperv(); return; }
  if (a === 'sv-local'){ E.sv.local = true; dibujar(); return; }
  if (a === 'sv-ed'){ E.sv.ed = t.dataset.ed; E.sv.abierto = ''; E.sv.tablet = ''; E.sv.bomb = ''; cargarSuperv(); return; }
  if (a === 'sv-vista'){ E.sv.vista = t.dataset.v; E.sv.abierto = ''; dibujar(); window.scrollTo(0, 0); return; }
  if (a === 'sv-avtipo'){ E.sv.avTipo = t.dataset.t; E.sv.abierto = ''; dibujar(); return; }
  if (a === 'sv-avfil'){ E.sv.avFil = t.dataset.f; dibujar(); return; }
  if (a === 'sv-obs'){ E.sv.obs = t.dataset.o; dibujar(); return; }
  if (a === 'sv-vttipo'){ E.sv.vtTipo = t.dataset.t; dibujar(); return; }
  if (a === 'sv-abrir'){ E.sv.abierto = E.sv.abierto === t.dataset.u ? '' : t.dataset.u; dibujar(); return; }
  if (a === 'sup-fil'){ E.supFil = t.dataset.f; dibujar(); return; }
  if (a === 'ver-sust'){ E.pantalla = 'buscar'; E.tipo = equiposDe('HID').some(esSust) ? 'HID' : 'HIN'; E.q = ''; E.soloSust = true; E.msg = ''; dibujar(); return; }
  if (a === 'solo-sust'){ E.soloSust = !E.soloSust; dibujar(); return; }
  if (a === 'b-est'){ E.bEst = t.dataset.v; dibujar(); return; }
  if (a === 'manga'){ E.control.manga = { accion: t.dataset.v, ident: '', vto: '' }; E.msg = ''; dibujar(); window.scrollTo(0, 0); return; }
  if (a === 'manga-no'){ E.control.manga = null; E.msg = ''; dibujar(); return; }
  if (a === 'manga-ok'){ guardarManga(); return; }
  if (a === 'dep-elegir'){ const d = (E.cat.equipos || []).find(x => x.tipo === 'EXT' && x.pos === t.dataset.pos); Object.assign(E.control.cambio, Object.fromEntries(DATOS_EXT.map(k => [k, d[k] || ''])), { desde: d.pos }); E.msg = ''; dibujar(); return; }
  if (a === 'dep-otro'){ Object.assign(E.control.cambio, Object.fromEntries(DATOS_EXT.map(k => [k, ''])), { desde: '' }); dibujar(); return; }
  if (a === 'dep-cargar'){ const e = E.control.eq; E.control.deposito = depRecargar(e) ? { ident: e.ident, clase: e.clase, peso: e.peso } : {}; E.msg = ''; dibujar(); return; }
  if (a === 'dep-no'){ E.control.deposito = null; E.msg = ''; dibujar(); return; }
  if (a === 'dep-ok'){ guardarDeposito(); return; }
  if (a === 'tipo'){ E.tipo = t.dataset.t; dibujar(); return; }
  if (a === 'elegir'){ abrirControl(t.dataset.pos, t.dataset.t); return; }
  if (a === 'cancelar'){ E.control = null; E.pantalla = 'inicio'; E.msg = ''; dibujar(); return; }
  if (a === 'resp'){ // tocar de nuevo la misma respuesta la desmarca
    const k = t.dataset.k; if (E.control.resp[k] === t.dataset.v) delete E.control.resp[k]; else E.control.resp[k] = t.dataset.v;
    E.msg = ''; dibujar(); return; }
  if (a === 'todo-si'){ rutDe(E.control.eq).forEach(([k]) => { E.control.resp[k] = 'SI'; }); dibujar(); return; }
  if (a === 'cambio'){ const e = E.control.eq; E.control.reemplazo = t.dataset.r === '1';
    E.control.cambio = Object.assign({ reemplazo: E.control.reemplazo, ident: '', motivo: t.dataset.motivo || '' },
      E.control.reemplazo ? {} : Object.fromEntries(['ubic'].concat(e.tipo === 'EXT' ? DATOS_EXT : ['ident', 'vtoManga']).map(k => [k, e[k] || ''])));
    dibujar(); return; }
  if (a === 'vacio'){ E.control.vacio = true; E.msg = ''; dibujar(); return; }
  if (a === 'vacio-no'){ E.control.vacio = false; dibujar(); return; }
  if (a === 'cambio-no'){ E.control.cambio = null; E.control.reemplazo = false; dibujar(); return; }
  if (a === 'guardar'){ guardarControl(); return; }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.dataset.tk){ const r = borrador(E.ot.id).resp; r[el.dataset.tk] = Object.assign(r[el.dataset.tk] || {}, { [el.dataset.f]: el.value }); guardarBorrador(); actualizarProgresoOt(); return; }
  if (el.id === 'ot-obs'){ borrador(E.ot.id).obs = el.value; guardarBorrador(); return; }
  if (el.id === 'eq-obs'){ const b = borrador(E.ot.id); (b.obsEq = b.obsEq || {})[E.ot.parte + '|' + E.ot.eq] = el.value; guardarBorrador(); return; }
  if (el.id === 'ent-motivo'){ E.entMotivo = el.value; const b = document.querySelector('[data-a="entregar-ok"]'); if (b) b.disabled = el.value.trim().length < 3 || !E.online; return; }
  if (el.id === 'c-obs') E.control.obs = el.value;
  else if (el.dataset.cambio) E.control.cambio[el.dataset.cambio] = el.value;
  else if (el.dataset.manga) E.control.manga[el.dataset.manga] = el.value;
  else if (el.dataset.dep) E.control.deposito[el.dataset.dep] = el.value;
  else if (el.id === 'b-q'){ E.q = el.value; dibujar(); }
  else if (el.id === 'sv-q'){ E.sv.q = el.value; dibujar(); const i = document.getElementById('sv-q'); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.tk && el.dataset.f === 'val') topeMed(el.dataset.tk, el.value);
  if (el.id === 'b-piso'){ E.bPiso = el.value; dibujar(); return; }
  // Técnico: ordenar y filtrar sus OT (por piso, por tipo o por rutina anual / semestral / especial)
  const kf = { 'tec-orden': 'orden', 'tec-tipo': 'fTipo', 'tec-piso': 'fPiso', 'tec-rut': 'fRut' }[el.id];
  if (kf){ E[kf] = el.value; dibujar(); return; }
  if (el.id === 'l-bomb' && el.value){ E.bomberoPin = el.value; E.pin = ''; E.msg = ''; dibujar(); }
  if (el.id === 'c-foto') fotoElegida(el);
  if (el.id === 'sv-tipo'){ E.sv.tipo = el.value; dibujar(); }
  if (el.id === 'sv-tablet'){ E.sv.tablet = el.value; dibujar(); }
  if (el.id === 'sv-bomb'){ E.sv.bomb = el.value; dibujar(); }
  if (el.id === 'sv-dias'){ E.sv.dias = el.value === 'cal' ? 'cal' : Number(el.value);
    if (E.sv.dias === 'cal'){ const d = E.sv.datos; E.sv.desde = E.sv.desde || (d && d.desde) || ''; E.sv.hasta = E.sv.hasta || (d && d.hoy) || ''; dibujar(); } else cargarSuperv(); }
  if (el.id === 'sv-desde' || el.id === 'sv-hasta'){ E.sv[el.id === 'sv-desde' ? 'desde' : 'hasta'] = el.value; if (E.sv.desde) cargarSuperv(); }
});
// Actualización automática: manda lo pendiente y baja bomberos, equipos y avance. Sin botón: pasa sola cada vez que hay señal.
async function actualizarSola(){
  if (!navigator.onLine || !E.tablet || E.enviando) return;
  await sincronizar(); await bajar();
  // Solo se redibuja donde no se está cargando nada (el control de un equipo no se toca)
  if (E.pantalla === 'login' || E.pantalla === 'inicio' || E.pantalla === 'buscar') dibujar();
}
window.addEventListener('online', () => { E.online = true; dibujar(); actualizarSola(); });
window.addEventListener('offline', () => { E.online = false; dibujar(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') actualizarSola(); }); // al volver a abrir la app
setInterval(() => { if (navigator.onLine && E.cola.length) sincronizar(); }, 60000);
// Técnico en "Mis OT" con la app abierta (11/11/2026): la lista se baja sola cada 5 minutos. Antes solo al entrar o al
// volver a la app, y una OT asignada mientras tanto (o de otra instalación: las carpetas) no aparecía hasta salir y entrar
setInterval(() => { if (esTec() && E.sesion && E.pantalla === 'inicio' && document.visibilityState === 'visible') actualizarSola(); }, 5 * 60000);
// Cada 2 minutos; si la tablet todavía no tiene bomberos, cada 20 segundos
setInterval(() => { if (E.pantalla === 'login' && !(E.cat && E.cat.bomberos || []).length) actualizarSola(); }, 20000);
setInterval(actualizarSola, 120000);

/* ---------- arranque ---------- */
(async () => {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  try { const q = new URLSearchParams(location.search).get('q'); if (q){ E.qr = q.slice(0, 20); history.replaceState(null, '', location.pathname); } } catch(e){}
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); // que el navegador no borre lo guardado
  E.tablet = await DB.get('tablet') || null;
  E.cat = await DB.get('catalogo') || null;
  E.cola = await DB.cola();
  E.borr = await DB.get('borradores') || {};
  try { E.sesion = JSON.parse(sessionStorage.getItem('sesion')); } catch(e){}
  if (!E.tablet || !E.cat){ E.pantalla = 'vincular'; dibujar(); return; }
  if (E.sesion && !(E.cat.bomberos || []).some(b => b.id === E.sesion.id)) E.sesion = null;
  E.pantalla = E.sesion ? 'inicio' : 'login';
  dibujar();
  sincronizar().then(bajar).then(dibujar);
})();
window.__E = E; window.__app = { abrirControl, entrarConQR, dibujar, DB, cargarHistorial }; // para las pruebas
})();
</script>
